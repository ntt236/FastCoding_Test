<!-- Visited Main Projects Section -->
<section class="section projects-section">

    <div class="section-header text-center">
      <h2 class="section-title">Visited main projects successful</h2>
    </div>

    <div class="projects-grid">
      <!-- City 1: San Francisco -->
      <div class="project-city-card" style="background-image: linear-gradient(rgba(20,27,43,0.5), rgba(20,27,43,0.7)), url('https://images.unsplash.com/photo-1501594907352-04cda38ebc29?auto=format&fit=crop&w=700&q=80');">
        <h3 class="city-name">San Francisco, California</h3>
        <a href="#" class="btn-see-more">See more <i class="fa-solid fa-chevron-right"></i></a>
      </div>

      <!-- City 2: Washington DC -->
      <div class="project-city-card" style="background-image: linear-gradient(rgba(20,27,43,0.5), rgba(20,27,43,0.7)), url('https://images.unsplash.com/photo-1617581629397-a72507c3de9e?auto=format&fit=crop&w=700&q=80');">
        <h3 class="city-name">Washington DC</h3>
        <a href="#" class="btn-see-more">See more <i class="fa-solid fa-chevron-right"></i></a>
      </div>

      <!-- City 3: Chicago -->
      <div class="project-city-card" style="background-image: linear-gradient(rgba(20,27,43,0.5), rgba(20,27,43,0.7)), url('https://images.unsplash.com/photo-1494522855154-9297ac14b55f?auto=format&fit=crop&w=700&q=80');">

        <a href="#" class="btn-see-more">See more <i class="fa-solid fa-chevron-right"></i></a>

    </div>

    <!-- Mid-page Newsletter Subscription Form -->
    <div class="mid-newsletter-wrapper">
      <form class="newsletter-bar" onsubmit="event.preventDefault();">
        <div class="input-with-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="Enter your email here" required>
        </div>
        <button type="submit" class="btn btn-primary">Subscribe</button>
      </form>
    </div>
  </div>
</section>
