<!-- Contact / Looking For To Buy A Property? Section -->
<section class="section contact-section" id="contact">
  <div class="container">
    <div class="section-header text-center mb-60">
      <span class="section-badge-text">Contact with us</span>
      <h2 class="section-title">Looking For To Buy A Property?</h2>
    </div>

    <div class="contact-row">
      <!-- Left Column: Info & Graphic -->
      <div class="contact-info-col">
        <p class="contact-lead">
          Browse our property listing and find your best and suitable home or house for sale, rent and buying. It's so
          easy and fast.
        </p>

        <ul class="contact-checklist">
          <li><i class="fa-solid fa-check"></i> Archit ecto beatae vitae dicta sunt</li>
          <li><i class="fa-solid fa-check"></i> Largest global RealEstate market</li>
          <li><i class="fa-solid fa-check"></i> Nor again is there anyone</li>
        </ul>

        <div class="contact-decorative-graphic">
          <div class="graphic-img-card">
            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=700&q=80"
              class="contact-image contact-image-back" alt="Modern room">
            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=700&q=80"
              class="contact-image contact-image-front" alt="Modern room">
            <div class="floating-accent-square"></div>
            <div class="floating-dark-square"></div>
          </div>
        </div>
      </div>

      <!-- Right Column: Contact Us Form Card -->
      <div class="contact-form-col">
        <div class="contact-form-card">
          <h3 class="form-title">Contact Us</h3>
          <form onsubmit="event.preventDefault();">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" rows="5" placeholder="Enter your message" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Send message</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
